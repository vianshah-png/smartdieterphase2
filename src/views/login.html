<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Access | BN 2.0</title>
    <style>
        :root {
            --bg: #050505;
            --card-bg: rgba(20, 20, 25, 0.8);
            --border: #1fef9555;
            --accent-green: #00ff88;
            --glow: rgba(0, 255, 136, 0.3);
            --text-main: #e0e0e0;
        }

        body { 
            background: var(--bg);
            /* Dark tech grid background */
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 50px 50px;
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Courier New', monospace; /* Monospace for terminal feel */
            margin: 0;
            overflow: hidden;
        }

        /* Scanline Effect */
        body::before {
            content: " ";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }

        .login-card { 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: 4px; /* Sharper corners for industrial look */
            border: 1px solid var(--accent-green); 
            width: 100%;
            max-width: 400px;
            text-align: center; 
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px var(--glow);
            position: relative;
            z-index: 20;
        }

        .logo-area {
            font-size: 3rem;
            color: var(--accent-green);
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--accent-green);
        }

        h3 { 
            margin-bottom: 30px; 
            font-size: 1.2rem; 
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent-green);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input { 
            width: 100%; 
            padding: 15px; 
            background: rgba(0, 0, 0, 0.6); 
            border: 1px solid #333; 
            color: var(--accent-green); 
            box-sizing: border-box; 
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus { 
            border-color: var(--accent-green); 
            box-shadow: 0 0 10px var(--glow);
        }

        button { 
            width: 100%; 
            padding: 15px; 
            background: transparent; 
            border: 1px solid var(--accent-green); 
            color: var(--accent-green); 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        button:hover { 
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 0 20px var(--accent-green);
        }

        .status-msg {
            font-size: 0.8rem;
            margin-top: 15px;
            color: #666;
            text-transform: uppercase;
        }

        /* Glitch Animation for Logo */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        .glitch-text { animation: glitch 1s infinite alternate-reverse; }

    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-area glitch-text">BN</div>
        <h3>System Authenticator</h3>
        
        <div class="input-group">
            <input type="text" id="user" placeholder="ID_IDENTIFIER" autocomplete="username">
        </div>
        
        <div class="input-group">
            <input type="password" id="pass" placeholder="ACCESS_KEY" autocomplete="current-password">
        </div>
        
        <button onclick="doLogin()">Initiate Handshake</button>
        
        <div class="status-msg" id="status">Waiting for uplink...</div>
    </div>
    
    <script>
        async function doLogin() {
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            const status = document.getElementById('status');

            if (!user || !pass) return alert("CRITICAL ERROR: MISSING_CREDENTIALS");

            status.innerText = "AUTHENTICATING...";
            status.style.color = "var(--accent-green)";

            try {
                const res = await fetch('/api/v1/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                
                const result = await res.json();
                if(result.success) {
                    status.innerText = "ACCESS_GRANTED. REDIRECTING...";
                    setTimeout(() => {
                        window.location.href = '/api/v1/admin/monitor';
                    }, 1000);
                } else {
                    status.innerText = "ERROR: ACCESS_DENIED_BY_FIREWALL";
                    status.style.color = "#ff4d4d";
                }
            } catch (err) {
                status.innerText = "SYSTEM_FAILURE: SERVER_UNREACHABLE";
                status.style.color = "#ff4d4d";
            }
        }

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
